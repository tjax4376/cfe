# CFE Agent Gateway Configuration
#
# Each agent binds a name to a vendor, model, and credentials.
# API keys are referenced by environment variable name for security.
#
# Supported vendors: openai, anthropic, google, local, http

agents:
  tutor:
    vendor: openai
    model: gpt-4o
    api_key_env: OPENAI_API_KEY
    system_prompt: "You are a patient programming tutor. Explain concepts clearly and concisely."
    max_tokens: 1000
    temperature: 0.7

  searcher:
    vendor: openai
    model: gpt-4o
    api_key_env: OPENAI_API_KEY
    system_prompt: "You are a search assistant. Find relevant information and return concise results."
    max_tokens: 1000
    temperature: 0.3

  writer:
    vendor: anthropic
    model: claude-sonnet-4-20250514
    api_key_env: ANTHROPIC_API_KEY
    system_prompt: "You are a writing assistant. Summarize and format content clearly."
    max_tokens: 2000
    temperature: 0.5

  reviewer:
    vendor: anthropic
    model: claude-sonnet-4-20250514
    api_key_env: ANTHROPIC_API_KEY
    system_prompt: "You review content for accuracy and completeness."
    max_tokens: 1000
    temperature: 0.3
